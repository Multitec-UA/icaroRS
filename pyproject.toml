# icaroRS — Multitec rocket simulation monorepo.
#
# This root is a uv workspace, NOT a package itself. The real code lives under:
#   packages/  → libraries (rocketpy, rocketserializer, icaro domain)
#   apps/      → delivery mechanisms (cli, api, web) — added in later phases
#
# Install everything (editable, cross-linked) with:  uv sync
# Docs on the layout and rules live in ARCHITECTURE.md.

[tool.uv.workspace]
members = ["packages/*", "apps/*"]
