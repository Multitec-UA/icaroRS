[project]
name = "icaro-cli"
version = "0.1.0"
description = "icaroRS command-line interface — a thin delivery layer over the icaro domain."
requires-python = ">=3.10"
dependencies = [
    "icaro",
    "typer>=0.12",
]

[project.scripts]
icaro = "icaro_cli.main:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["icaro_cli"]

[tool.uv.sources]
icaro = { workspace = true }
