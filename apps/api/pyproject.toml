[project]
name = "icaro-api"
version = "0.1.0"
description = "icaroRS FastAPI delivery surface — thin HTTP layer over the icaro domain."
requires-python = ">=3.10"
dependencies = [
    "icaro",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic-settings",
    "httpx",
]

[project.optional-dependencies]
# [convert] extra — gates the JVM/rocketserializer dependency.
# Default install is JVM-free.  To enable POST /api/convert:
#   pip install 'icaro-api[convert]'
# Also requires: Java 21+ installed on the system.
convert = [
    "icaro[convert]",
]

# [gcp] extra — gates the Google Cloud client libraries for production
# persistence.  Default install is GCP-free (uses the LocalFs + InMemory
# adapters; data is ephemeral).  To enable GCS-backed artifact storage +
# Firestore metadata in production:
#   pip install 'icaro-api[gcp]'   (or: uv sync --extra gcp)
# Also requires the ICARO_GCS_BUCKET + ICARO_FIRESTORE_PROJECT env vars and the
# matching IAM on the runtime service account.  See DEPLOY.md → Persistence.
gcp = [
    "google-cloud-storage>=2.14",
    "google-cloud-firestore>=2.16",
    "firebase-admin>=6.5",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["icaro_api"]

# In this monorepo, icaro resolves to packages/icaro — never PyPI.
[tool.uv.sources]
icaro = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "httpx",
    "pytest-asyncio>=0.23",
    "anyio[trio]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (require JVM/network/real files — skip in CI)",
]
