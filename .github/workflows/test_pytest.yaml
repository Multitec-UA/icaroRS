name: Tests (RocketPy core)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "rocketpy/**"
      - "tests/**"
      - "data/**"
      - "pyproject.toml"
      - "requirements*"
      - ".github/workflows/test_pytest.yaml"
  push:
    branches: [main]
    paths:
      - "rocketpy/**"
      - "tests/**"
      - "data/**"
      - "pyproject.toml"
      - "requirements*"
      - ".github/workflows/test_pytest.yaml"

defaults:
  run:
    shell: bash

jobs:
  Pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      PYTHON: ${{ matrix.python-version }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-tests.txt
            requirements-optional.txt

      - name: Install rocketpy
        run: pip install .

      - name: Test importing rocketpy
        run: python -c "import sys, rocketpy; print(f'{rocketpy.__name__} running on Python {sys.version}')"

      - name: Install test dependencies
        run: |
          pip install -r requirements-tests.txt
          pip install .[all]

      - name: Run Unit Tests
        run: pytest tests/unit --cov=rocketpy

      - name: Run Documentation Tests
        run: |
          pip install numpy --upgrade
          pytest rocketpy --doctest-modules --cov=rocketpy --cov-append

      - name: Run Integration Tests
        run: pytest tests/integration --cov=rocketpy --cov-append

      - name: Run Acceptance Tests
        run: pytest tests/acceptance --cov=rocketpy --cov-append
