name: Web visual snapshots (regenerate)

# Manual job: renders every Playwright screenshot inside the same Linux image
# the `web-visual` CI job uses and uploads apps/web/e2e/__screenshots__ as an
# artifact. Download it, replace the committed snapshots and commit them, so
# CI compares pixels against renders from its own platform. Useful when the
# authoring machine cannot run the Playwright Docker image.
on:
  workflow_dispatch:

jobs:
  regenerate:
    name: Regenerate snapshots (Playwright, Linux)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Render every snapshot
        run: npx playwright test --update-snapshots=all

      - name: Compare once against the fresh renders
        run: npx playwright test

      - name: Upload snapshots
        uses: actions/upload-artifact@v4
        with:
          name: web-visual-snapshots
          path: apps/web/e2e/__screenshots__
          retention-days: 7
