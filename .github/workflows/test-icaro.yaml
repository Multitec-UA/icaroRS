name: Tests (icaro · API · web)

# CI for the FIRST-PARTY code (issue #14). The inherited rocketpy /
# rocketserializer workflows only cover packages/rocketpy and
# packages/rocketserializer — this one guards the domain, the API and the web.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "packages/icaro/**"
      - "apps/api/**"
      - "apps/web/**"
      - ".github/workflows/test-icaro.yaml"
  push:
    branches: [main]
    paths:
      - "packages/icaro/**"
      - "apps/api/**"
      - "apps/web/**"
      - ".github/workflows/test-icaro.yaml"

jobs:
  # ---------------------------------------------------------------------------
  # Domain + API — uv workspace, strict-TDD unit suites (integration skipped).
  # ---------------------------------------------------------------------------
  python:
    name: Python (icaro + api)
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      # Java 21 is here for forward-compat: any JVM-bound test (convert) needs
      # it, mirroring the serializer workflow. Unit suites skip integration, but
      # provisioning it keeps the job correct as integration tests are added.
      - name: Set up Java 21 (OpenRocket .jar / convert)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace (all packages + dev groups)
        run: uv sync --all-packages --all-groups

      - name: icaro unit tests (TDD suite)
        working-directory: packages/icaro
        run: uv run --no-sync pytest -m "not integration" -v

      - name: api unit tests (TDD suite)
        working-directory: apps/api
        run: uv run --no-sync pytest -m "not integration" -v

  # ---------------------------------------------------------------------------
  # Firestore emulator — integration tests (T-46/T-47, issue #29).
  #
  # Runs the Firestore-emulator integration suite that was deferred from the
  # unit job.  The unit job uses -m "not integration"; this job explicitly
  # selects -m integration and scopes to the emulator test file only (so it
  # does not accidentally pull in JVM-bound tests like test_convert_router.py
  # or network-bound tests like test_elevation.py).
  #
  # Key choices:
  # - gcp extra: google-cloud-firestore is NOT installed by --all-groups;
  #   we install it explicitly with --extra gcp (mirrors the Dockerfile).
  # - Emulator auth: the google-cloud-firestore client auto-connects when
  #   FIRESTORE_EMULATOR_HOST is set — no code change in the adapter.
  # - Test selection: scoped to tests/test_firestore_emulator.py, not the full
  #   -m integration set, so only the emulator tests run in this job.
  # ---------------------------------------------------------------------------
  firestore-integration:
    name: Firestore emulator (integration)
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      # The emulator stores no real data, but the gcloud CLI requires a project
      # to be set to start it (none is configured on a clean CI runner).
      CLOUDSDK_CORE_PROJECT: icaro-emulator-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21 (Firestore emulator is a JVM app)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install icaro-api with [gcp] extra
        # --all-groups installs dev dependencies (pytest etc.); --extra gcp
        # adds google-cloud-firestore (not included in the default workspace
        # sync because it is an optional production dependency).
        run: uv sync --package icaro-api --all-groups --extra gcp

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          # No project or credentials needed — emulator only, no real GCP calls.
          skip_install: false

      - name: Install Firestore emulator component
        run: gcloud components install cloud-firestore-emulator beta --quiet

      - name: Start Firestore emulator
        run: |
          gcloud emulators firestore start --host-port=127.0.0.1:8085 &
          # Wait up to 30 s for the emulator to accept connections.
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 8085 2>/dev/null; then
              echo "Firestore emulator ready after ${i}s"
              break
            fi
            sleep 1
          done
          nc -z 127.0.0.1 8085 || (echo "Emulator did not start" && exit 1)

      - name: Run Firestore emulator integration tests
        working-directory: apps/api
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
        run: >-
          uv run --no-sync pytest
          -m integration
          tests/test_firestore_emulator.py
          tests/test_backfill_org_id_emulator.py
          tests/test_migrate_rocket_exports_emulator.py
          -v

  # ---------------------------------------------------------------------------
  # Web — typecheck + lint + unit tests + production build. The build catches
  # bundler/RSC failures (server/client boundary, dynamic imports) that
  # tsc/eslint/vitest miss.
  # ---------------------------------------------------------------------------
  web:
    name: Web (apps/web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: i18n catalog completeness
        run: npm run i18n:check

      - name: API types drift check
        run: npm run api:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest + React Testing Library)
        run: npm test

      - name: Production build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Web visual regression — Playwright screenshots of every screen, both
  # themes, against a deterministic stub API (apps/web/e2e/). Runs in the same
  # image as `npm run e2e:visual` locally, so pixels match the committed
  # snapshots in apps/web/e2e/__screenshots__.
  # ---------------------------------------------------------------------------
  web-visual:
    name: Web visual (apps/web, Playwright)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      # The committed snapshots were rendered natively on macOS because Docker
      # could not pull the Playwright image on the authoring machine. Until they
      # are regenerated inside this image (`npm run e2e:visual:update`), CI runs
      # the suite without pixel comparison: it still proves the stub API, the
      # production build and every screen render. Drop `--ignore-snapshots`
      # once Linux snapshots are committed.
      - name: Visual regression (Playwright)
        run: npx playwright test --ignore-snapshots

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

      # Fresh renders from this image, always: download the artifact to
      # re-baseline the committed snapshots from CI's own platform (the
      # authoring Mac cannot run the Playwright Docker image).
      - name: Render snapshots on Linux
        if: always()
        run: npx playwright test --update-snapshots=all --reporter=line

      - name: Upload Linux snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-visual-snapshots
          path: apps/web/e2e/__screenshots__
          retention-days: 7
